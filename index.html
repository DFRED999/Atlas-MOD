<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS MOD · הגשת חשבונות</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --ink:#1c2b2a; --paper:#eef2f0; --paper-2:#ffffff; --line:#d6ddd9; --head:#f7f9f8;
    --good:#1f6f5c; --good-bg:#e4f0ec; --bad:#9a3324; --bad-bg:#f6e6e2;
    --warn:#b3541e; --warn-bg:#fbeee2; --accent:#3d6b5c; --muted:#5f6f6a; --radius:6px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:13.5px;line-height:1.5;}
  header.top{background:var(--paper-2);border-bottom:2px solid var(--ink);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  header.top h1{font-size:19px;margin:0;font-weight:700;}
  header.top .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .chip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper-2);white-space:nowrap;}
  .chip.good{border-color:var(--good);color:var(--good);background:var(--good-bg);}
  .chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg);}
  .chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-bg);}
  button.chip{cursor:pointer;}
  nav.tabs{display:flex;gap:6px;padding:12px 24px 0;flex-wrap:wrap;}
  nav.tabs button{border:1px solid var(--line);background:var(--paper-2);padding:6px 16px;border-radius:999px;font-size:13px;cursor:pointer;}
  nav.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  main{padding:16px 24px 60px;max-width:1500px;margin:0 auto;}
  button{font-family:inherit;font-size:13px;border:1px solid var(--ink);background:var(--paper-2);color:var(--ink);border-radius:var(--radius);padding:6px 13px;cursor:pointer;}
  button.primary{background:var(--ink);color:#fff;}
  button.small{padding:3px 9px;font-size:12px;}
  button.ghost{border-color:var(--line);}
  button.danger{border-color:var(--bad);color:var(--bad);}
  button:disabled{opacity:.45;cursor:default;}
  button:hover:not(:disabled){opacity:.85;}
  input,select,textarea{font-family:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  input.num,.ltr{direction:ltr;text-align:right;}
  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;}
  .card h2{font-size:14px;margin:0 0 10px;}
  .card h3{font-size:12.5px;margin:12px 0 6px;color:var(--muted);font-weight:600;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .row.spread{justify-content:space-between;}
  .grow{flex:1;}
  .muted{color:var(--muted);} .small{font-size:12px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0;}
  .stat{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 13px;}
  .stat .label{font-size:11.5px;color:var(--muted);}
  .stat .value{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat.good .value{color:var(--good);} .stat.warn .value{color:var(--warn);}
  .tableWrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-2);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:right;font-size:11px;color:var(--muted);font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line);background:var(--head);white-space:nowrap;position:sticky;top:0;}
  td{padding:7px 8px;border-bottom:1px solid var(--paper);vertical-align:middle;}
  td.n{font-variant-numeric:tabular-nums;direction:ltr;text-align:right;white-space:nowrap;}
  tr.dup td{background:#fbf6e9;}
  tr.total td{font-weight:700;border-top:2px solid var(--ink);background:var(--head);}
  tr.clickable{cursor:pointer;} tr.clickable:hover td{background:#f3f6f5;}
  .steps{list-style:none;margin:8px 0;padding:0;}
  .steps li{padding:5px 0;display:flex;gap:8px;align-items:flex-start;border-bottom:1px dashed var(--paper);}
  .steps li .ic{width:18px;text-align:center;font-weight:700;flex:none;}
  .steps li.ok .ic{color:var(--good);} .steps li.bad .ic{color:var(--bad);} .steps li.warn .ic{color:var(--warn);}
  .alert{border-radius:var(--radius);padding:9px 13px;margin:8px 0;border:1px solid;}
  .alert.warn{background:var(--warn-bg);border-color:#e6c3a5;color:#6d3412;}
  .alert.bad{background:var(--bad-bg);border-color:#e3b9b0;color:var(--bad);}
  .alert.good{background:var(--good-bg);border-color:#b8d6cc;color:var(--good);}
  .alert.info{background:#eef1f7;border-color:#cfd7e6;color:#2d3b57;}
  .monthNav{display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;}
  .monthNav button{border:none;border-radius:0;padding:5px 12px;}
  .monthNav span{padding:5px 14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:92px;text-align:center;border-inline:1px solid var(--line);}
  .drop{border:2px dashed var(--line);border-radius:var(--radius);padding:16px;text-align:center;color:var(--muted);cursor:pointer;background:#fafcfb;margin-top:8px;}
  .drop.over{border-color:var(--accent);background:var(--good-bg);}
  .pill{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);white-space:nowrap;}
  .pill.ok{color:var(--good);border-color:var(--good);background:var(--good-bg);}
  .pill.diff{color:var(--bad);border-color:var(--bad);background:var(--bad-bg);}
  .pill.missing{color:var(--warn);border-color:var(--warn);background:var(--warn-bg);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px;}
  .form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);}
  .form label.wide{grid-column:1/-1;}
  .form label input,.form label select{color:var(--ink);}
  .stepBox{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-top:12px;}
  .stepBox h3{margin-top:0 !important;color:var(--ink) !important;font-size:13px !important;}
  .stepBox.done{border-color:var(--good);background:#f6fbf9;}
  .stepNo{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;align-items:center;justify-content:center;font-size:12px;margin-inline-end:6px;}
  .modalBg{position:fixed;inset:0;background:rgba(20,30,28,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;}
  .modal{background:#fff;border-radius:8px;max-width:880px;width:100%;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .modal h2{margin:0 0 12px;font-size:16px;}
  .modal .actions{display:flex;gap:8px;margin-top:16px;}
  #toast{position:fixed;bottom:18px;left:18px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;opacity:0;transition:opacity .2s;z-index:60;max-width:460px;pointer-events:none;}
  #toast.show{opacity:1;} #toast.err{background:var(--bad);}
  .busy{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:70;font-weight:700;}
  .busy.show{display:flex;}
  .empty{padding:24px;text-align:center;color:var(--muted);}
  details summary{cursor:pointer;color:var(--accent);font-size:12.5px;margin:6px 0;}
  code{background:var(--paper);padding:1px 5px;border-radius:3px;}
  ol.howto{margin:6px 0;padding-inline-start:20px;} ol.howto li{margin:3px 0;}
  .ico{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  nav.tabs button.tabBtn{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;transition:background .15s,box-shadow .15s,transform .1s;}
  nav.tabs button.tabBtn:hover{box-shadow:0 2px 8px rgba(28,43,42,.12);opacity:1;}
  nav.tabs button.tabBtn:active{transform:translateY(1px);}
  nav.tabs button.tabBtn .ico{color:var(--accent);}
  nav.tabs button.tabBtn.active .ico{color:#fff;}
  nav.tabs button.dashTab{border:1.5px solid var(--accent);color:var(--accent);font-weight:700;background:linear-gradient(180deg,#fff,#eef6f2);}
  nav.tabs button.dashTab.active{background:linear-gradient(135deg,#3d6b5c,#1c2b2a);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(61,107,92,.35);}
  nav.tabs button.dashTab .badge{margin-inline-start:2px;}
  nav.tabs button.lockBtn{border-color:var(--line);color:var(--muted);} nav.tabs button.lockBtn .ico{color:var(--muted);}
  .modSwitch{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;margin-inline-end:10px;}
  .modSwitch button{border:none;border-radius:0;padding:6px 14px;background:#fff;}
  .modSwitch button.on{background:var(--accent);color:#fff;}
  .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;}
  .bar{height:7px;background:var(--paper);border-radius:4px;overflow:hidden;min-width:70px;}
  .bar i{display:block;height:100%;background:var(--accent);}
  .bar.over i{background:var(--bad);}
  .stage{font-size:11.5px;white-space:nowrap;}
  .stage.done{color:var(--good);} .stage.todo{color:var(--muted);} .stage.late{color:var(--bad);font-weight:700;}
  .alertRow td:first-child{width:6px;padding:0;} .alertRow.bad td:first-child{background:var(--bad);} .alertRow.warn td:first-child{background:var(--warn);} .alertRow.info td:first-child{background:#8aa0c8;}
  .payLate{color:#c01818 !important;font-weight:800 !important;}
  .paySoon{color:#1747d1 !important;font-weight:800 !important;}
  .payDone{color:#0f7a3d !important;font-weight:800 !important;}
  .pill.late{color:#fff;background:#c01818;border-color:#c01818;font-weight:700;}
  .pill.soon{color:#fff;background:#1747d1;border-color:#1747d1;font-weight:700;}
  .pill.paid{color:#fff;background:#0f7a3d;border-color:#0f7a3d;font-weight:700;}
  .stat.late .value{color:#c01818;} .stat.soon .value{color:#1747d1;} .stat.paid .value{color:#0f7a3d;}
  .stat.late{border-color:#e7a3a3;} .stat.soon{border-color:#9db4ee;} .stat.paid{border-color:#9fd0b3;}
  details.fold{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;}
  details.fold > summary{list-style:none;cursor:pointer;padding:11px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--ink);margin:0;}
  details.fold > summary::-webkit-details-marker{display:none;}
  details.fold > summary::before{content:'▸';font-size:12px;color:var(--muted);transition:transform .15s;}
  details.fold[open] > summary::before{transform:rotate(90deg);}
  details.fold > summary .sumR{margin-inline-start:auto;font-weight:400;font-size:12px;color:var(--muted);}
  details.fold > .foldBody{padding:0 16px 14px;}
  details.fold.inner{border-style:dashed;margin:10px 0 0;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;}
  .pcard{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;}
  .pcard:hover{border-color:var(--accent);}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
  @media (max-width:800px){ .grid2{grid-template-columns:1fr;} main{padding:12px;} header.top{padding:12px;} nav.tabs{padding:10px 12px 0;} }
  @media (max-width:700px){
    body{font-size:14px;}
    header.top{padding:10px 12px;gap:6px;} header.top h1{font-size:16px;} header.top .sub{display:none;}
    .chips{gap:4px;} .chip{font-size:11px;padding:2px 8px;}
    nav.tabs{flex-wrap:wrap;padding:8px 10px 2px;gap:6px;}
    nav.tabs button{white-space:nowrap;padding:8px 12px;}
    nav.tabs button.tabBtn{flex:1 1 auto;justify-content:center;padding:8px 10px;gap:5px;}
    nav.tabs button.dashTab{flex-basis:100%;padding:10px;font-size:14px;}
    .modSwitch{flex:1 1 100%;margin:0 0 2px;} .modSwitch button{flex:1;white-space:nowrap;padding:8px 6px;font-size:12px;}
    main{padding:10px;}
    .card{padding:12px;}
    .stats{grid-template-columns:1fr 1fr;gap:8px;} .stat{padding:9px 10px;} .stat .value{font-size:16px;} .stat .label{font-size:11px;}
    button{min-height:38px;} button.small{min-height:32px;}
    input,select{font-size:16px;min-height:38px;}
    .row{gap:8px;}
    .pgrid{grid-template-columns:1fr;}
    details.fold > summary{padding:12px;} details.fold > .foldBody{padding:0 10px 12px;}
    .modalBg{padding:0;align-items:stretch;} .modal{border-radius:0;min-height:100vh;padding:14px 12px 90px;max-width:none;}
    .modal .actions{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;margin:0;z-index:5;}
    .modal .actions button{flex:1;} .modal .actions button.danger{flex:none;}
    #toast{left:10px;right:10px;bottom:10px;max-width:none;text-align:center;}
    .form{grid-template-columns:1fr;}
    /* טבלאות -> כרטיסים */
    .tableWrap:has(table.rtable){border:none;background:transparent;overflow:visible;}
    table.rtable, table.rtable tbody, table.rtable tr, table.rtable td{display:block;width:100%;}
    table.rtable thead{display:none;}
    table.rtable tr{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;margin:0 0 8px;padding:6px 12px;}
    table.rtable tr.total{background:var(--head);border-width:2px;border-color:var(--ink);}
    table.rtable td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:none;padding:5px 0;text-align:left;min-height:0;}
    table.rtable td.n{direction:rtl;text-align:left;}
    table.rtable td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;text-align:right;flex:none;max-width:48%;}
    table.rtable td[data-label=""]::before{display:none;}
    table.rtable td:empty{display:none;}
    table.rtable td .bar{flex:1;}
    table.rtable td > .row{justify-content:flex-end;}
    table.rtable td.empty{display:block;text-align:center;}
    .alertRow td{display:block;} .alertRow td:first-child{display:none;}
    .alertRow{display:block;border-inline-start:5px solid var(--warn);padding:8px 10px;} .alertRow.bad{border-inline-start-color:var(--bad);} .alertRow.info{border-inline-start-color:#8aa0c8;}
    .alertRow td{padding:2px 0;border:none;} .alertRow td:last-child{display:none;}
    .legend{font-size:11.5px;gap:10px;}
  }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>ATLAS MOD · הגשת חשבונות למשהב״ט</h1>
    <div class="sub">ב.ד. אטלס הנדסה וניהול פרויקטים · טופס 23.030 / 23.031</div>
  </div>
  <div class="chips" id="statusChips"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div id="modalRoot"></div>
<div id="toast"></div>
<div class="busy" id="busy"><div id="busyText">עובד…</div></div>

<script>
'use strict';
/* =====================================================================
   ATLAS MOD - גרסת דפדפן (קובץ HTML אחד)
   - גישה לתיקיות: File System Access API (Chrome / Edge), תיקיית בסיס אחת
   - נתונים: IndexedDB בדפדפן + קובץ ATLAS_MOD_data.json בתיקיית הבסיס
   - קבצים לא נשלחים לשום מקום; הכל מעובד בדפדפן
   ===================================================================== */
const APP_VERSION = '0.2';
const DATA_FILE = 'ATLAS_MOD_data.json';
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ===================================================================== utils */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const bdi = v => `<bdi dir="ltr">${esc(v)}</bdi>`;
const num = (v, d = 2) => (v === null || v === undefined || v === '' || isNaN(v)) ? '' : Number(v).toLocaleString('he-IL', {minimumFractionDigits: d, maximumFractionDigits: d});
const money = v => (v === null || v === undefined || v === '') ? '' : '₪' + num(v, 2);
const qty = v => (v === null || v === undefined || v === '' || isNaN(v)) ? '' : Number(v).toLocaleString('he-IL', {maximumFractionDigits: 2});
const r2 = x => x === null || x === undefined ? null : Math.round((Number(x) + 1e-9) * 100) / 100;
const monthLabel = m => m ? `${m.slice(5, 7)}.${m.slice(0, 4)}` : '';
const folderName = m => `${m.slice(5, 7)}-${m.slice(0, 4)}`;
const dateHe = d => d ? `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}` : '';
const hhmm = h => { const m = Math.round((h || 0) * 60); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };
const digits = s => String(s ?? '').replace(/\D/g, '');
const uid = p => `${p}_${Math.random().toString(36).slice(2, 12)}`;
function shiftMonth(m, k) { let y = +m.slice(0, 4), mm = +m.slice(5, 7) + k; while (mm < 1) { mm += 12; y--; } while (mm > 12) { mm -= 12; y++; } return `${y}-${String(mm).padStart(2, '0')}`; }
function monthRange(m) { const y = +m.slice(0, 4), mm = +m.slice(5, 7); const last = new Date(Date.UTC(y, mm, 0)).getUTCDate(); return [`${m}-01`, `${m}-${String(last).padStart(2, '0')}`]; }
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = '', err ? 7000 : 3000); }
function busy(on, text) { $('#busy').className = 'busy' + (on ? ' show' : ''); if (text) $('#busyText').textContent = text; }
async function run(fn, text) { busy(true, text || 'עובד…'); try { return await fn(); } catch (e) { console.error(e); toast(e.message || String(e), true); } finally { busy(false); } }
function nameTokens(s) { return new Set(String(s || '').trim().split(/[\s\-־]+/).filter(Boolean)); }
function samePerson(a, b) { const A = nameTokens(a), B = nameTokens(b); if (!A.size || !B.size) return false; const sub = (x, y) => [...x].every(t => y.has(t)); return sub(A, B) || sub(B, A); }

/* ===================================================================== cell values */
const QUOTES = {'״': '"', '׳': "'", '“': '"', '”': '"', '’': "'", '`': "'"};
function norm(s) { if (s === null || s === undefined) return ''; return String(s).replace(/[״׳“”’`]/g, c => QUOTES[c]).replace(/''/g, '"').replace(/\s+/g, ''); }
function serialToIso(v) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000); return d.toISOString().slice(0, 10); }
function isoToSerial(iso) { const [y, m, d] = iso.split('-').map(Number); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000); }
function toDate(v) {
  if (typeof v === 'number' && v > 20000 && v < 80000) return serialToIso(v);
  if (typeof v === 'string') { const m = v.trim().match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/); if (m) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`; } }
  return null;
}
function toMinutes(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return Math.abs(v) < 50 ? (v % 1 === v ? v : v % 1) * 1440 : null;
  const m = String(v).match(/^\s*(\d{1,2}):(\d{2})(?::(\d{2}))?\s*$/);
  return m ? +m[1] * 60 + +m[2] + (+(m[3] || 0)) / 60 : null;
}
function toHours(v) { if (v === null || v === undefined || v === '') return null; if (typeof v === 'number') return v * 24; const m = toMinutes(v); return m === null ? null : m / 60; }
function toNumber(v) { if (typeof v === 'number') return v; if (typeof v === 'string') { const t = v.replace(/[,₪\s]/g, ''); if (t !== '' && !isNaN(t)) return Number(t); } return null; }
const colL = c => XLSX.utils.encode_col(c - 1);

const GENERATED = /^(חשבון_|חשבון_ודיווח|בדיקת_המרה)|מאוחד|^~\$/;
const REPORT_NAME = /דיווח[\s_]*שעות|שעות[\s_]*עבודה/;
function reportCandidates(entries) {
  const g = {};
  for (const e of entries) {
    if (e.kind !== 'file' || GENERATED.test(e.name)) continue;
    const m = /^(.*)\.(pdf|xlsx|xls)$/i.exec(e.name); if (!m || !REPORT_NAME.test(e.name)) continue;
    (g[m[1].trim()] = g[m[1].trim()] || {stem: m[1].trim()})[m[2].toLowerCase()] = e.name;
  }
  return Object.values(g);
}
function outputNames(month, n) { const f = folderName(month); return {xlsx: `חשבון_${f}_${n}.xlsx`, pdf: `חשבון_${f}_${n}.pdf`, merged: `חשבון_ודיווח_שעות_${f}_${n}.pdf`}; }

async function scanMonth(stem) {
  const p = personById(S.personId); const steps = []; const out = {steps};
  try {
    const base = await personDir(p);
    const mfName = folderName(S.month);
    const mf = await subDir(base, mfName);
    if (!mf) {
      const all = (await listEntries(base)).filter(x => x.kind === 'directory').map(x => x.name);
      const y = S.month.slice(0, 4), m = +S.month.slice(5, 7);
      const re = new RegExp(`^0?${m}[\\s._\\-]+${y}$|^${y}[\\s._\\-]+0?${m}$`);
      const hints = all.filter(n => re.test(n) && n !== mfName);
      steps.push({ok: false, text: `תיקיית החודש ${mfName} לא קיימת. יש ליצור אותה ידנית בתוך תיקיית העובד.` + (hints.length ? ` נמצאו תיקיות בשם דומה: ${hints.join(', ')} — השם צריך להיות בדיוק ${mfName}.` : '')});
      return out;
    }
    out.monthOk = true;
    steps.push({ok: true, text: `תיקיית חודש נמצאה: ${mfName}`});
    let c = reportCandidates(await listEntries(mf));
    out.candidates = c;
    if (stem) c = c.filter(x => x.stem === stem);
    if (!c.length) { steps.push({ok: false, text: 'לא נמצא דוח שעות מקור בתיקייה (קובץ ששמו כולל "דיווח שעות" או "שעות עבודה").'}); return out; }
    if (c.length > 1) { steps.push({ok: null, text: `נמצאו ${c.length} דוחות שעות אפשריים - יש לבחור אחד.`}); out.needChoice = true; return out; }
    const r = c[0]; out.report = r;
    steps.push({ok: true, text: `דוח שעות מקור נמצא: \u2066${r.stem}\u2069 (${['xlsx', 'pdf', 'xls'].filter(k => r[k]).map(k => k.toUpperCase()).join(' + ')})`});
    if (r.xlsx) {
      const d = parse23031(await readFile(mf, r.xlsx), r.xlsx);
      out.parsed = d; out.compare = compareEmployee(p, d.employee);
      const m = ordersOf(p.id).filter(o => digits(o.number) === digits(d.order.number)); out.orderMatch = m.length === 1 ? m[0].id : null;
      if (d.month && d.month !== S.month) d.warnings.unshift(`התאריכים בדוח שייכים לחודש ${monthLabel(d.month)} ולא לחודש שנבחר (${monthLabel(S.month)}).`);
      steps.push({ok: true, text: `הדוח נקרא: ${qty(d.hours.final)} שעות, ${d.km.uniqueDays} ימי עבודה, ${qty(d.km.final)} ק״מ`});
    } else if (r.xls) steps.push({ok: false, text: 'הדוח שמור בפורמט XLS ישן. יש לשמור אותו ב-Excel כ-XLSX.'});
    else steps.push({ok: null, text: 'הדוח קיים רק כ-PDF - יש להזין שעות וק״מ ידנית, או לשים גם את קובץ ה-Excel בתיקייה.'});
    if (!r.pdf) steps.push({ok: null, text: 'אין PDF של דוח השעות. לפני האיחוד יש לשמור אותו גם כ-PDF (ב-Excel: קובץ ← שמירה בשם ← PDF).'});
  } catch (e) { steps.push({ok: false, text: e.message}); }
  return out;
}
async function prepareInvoice(opts) {
  const p = personById(S.personId); const rep = reportFor(S.personId, S.month); const o = orderById(rep.orderId);
  const n = Number(opts.invoiceNo); const steps = []; const out = {steps};
  const base = await personDir(p);
  const mf = await subDir(base, folderName(S.month));
  if (!mf) { steps.push({ok: false, text: `תיקיית החודש ${folderName(S.month)} לא קיימת.`}); return out; }
  steps.push({ok: true, text: 'תיקיית חודש נמצאה'});
  let src, srcName, prev, isFirst;
  if (n === 1) {
    const tpl = await blobGet('tpl:' + o.id);
    if (!tpl) { steps.push({ok: false, text: 'חשבון ראשון: יש להעלות תבנית טופס 23.030 להזמנה זו.'}); out.needTemplate = true; return out; }
    src = tpl; srcName = o.templateName || 'תבנית'; prev = readInvoice(tpl, srcName); isFirst = true;
    steps.push({ok: true, text: `חשבון ראשון - תבנית: \u2066${srcName}\u2069`});
  } else {
    const pm = shiftMonth(S.month, -1);
    if (opts.previousFile) { src = opts.previousFile.buf; srcName = opts.previousFile.name; prev = readInvoice(src, srcName); steps.push({ok: true, text: `חשבון קודם (נבחר): \u2066${srcName}\u2069`}); }
    else {
      const pf = await subDir(base, folderName(pm));
      if (!pf) { steps.push({ok: false, text: `תיקיית החודש הקודם ${folderName(pm)} לא קיימת.`}); return out; }
      const found = [], rejected = [];
      for (const e of await listEntries(pf)) {
        if (e.kind !== 'file' || !/\.xlsx$/i.test(e.name) || e.name.startsWith('~$')) continue;
        try {
          const buf = await readFile(pf, e.name); const inv = readInvoice(buf, e.name); const why = [];
          if (inv.orderDigits !== digits(o.number)) why.push('הזמנה ' + inv.orderDisplay);
          if (inv.invoiceNo !== n - 1) why.push('חשבון מס׳ ' + inv.invoiceNo);
          const hl = inv.lines.filter(l => l.kind === 'hours');
          if (!hl.some(l => samePerson(l.name, p.name)) && hl.length !== 1) why.push('העובד לא נמצא בטופס');
          if (why.length) rejected.push({file: e.name, reason: why.join(', ')}); else found.push({name: e.name, buf, inv});
        } catch (err) { rejected.push({file: e.name, reason: err.message.slice(0, 90)}); }
      }
      out.rejected = rejected;
      if (!found.length) { steps.push({ok: false, text: `לא נמצא חשבון מס׳ ${n - 1} של הזמנה ${o.number} בתיקייה ${folderName(pm)}.`}); out.allowPick = true; return out; }
      let f = found;
      if (f.length > 1) { const std = outputNames(pm, n - 1).xlsx; const pr = f.filter(x => x.name === std); if (pr.length === 1) f = pr; }
      if (f.length > 1) { steps.push({ok: null, text: `נמצאו ${f.length} קבצים מתאימים - יש לבחור.`}); out.previousChoices = f.map(x => ({name: x.name, buf: x.buf})); return out; }
      src = f[0].buf; srcName = f[0].name; prev = f[0].inv;
      steps.push({ok: true, text: `חשבון קודם נמצא: \u2066${folderName(pm)}\\${srcName}\u2069`});
    }
    isFirst = false;
    if (prev.orderDigits !== digits(o.number)) throw new Error('מספר ההזמנה בחשבון הקודם אינו תואם.');
  }
  const plan = planNextInvoice(prev, p.name, o, S.month, n, repLinesOf(rep, o), opts.dealNo || rep.dealInvoiceNo, opts.invoiceType, isFirst);
  steps.push({ok: true, text: 'מצטברים חושבו'});
  const names = outputNames(S.month, n);
  const exists = {xlsx: await fileExists(mf, names.xlsx), pdf: await fileExists(mf, names.pdf), merged: await fileExists(mf, names.merged)};
  Object.assign(out, {ready: true, plan, src, srcName, prev, isFirst, names, exists, invoiceNo: n, reportPdf: rep.reportPdf, reportXlsx: rep.reportXlsx});
  return out;
}

/* ---------- נעילת "הגשת חשבונות משהב"ט" בקוד (נשמר כ-hash, משותף לכל המשתמשים דרך המסד) */

function importOrderPdf() {
  pickFile('.pdf', f => run(async () => {
    const r = await parseOrderPdf(await f.arrayBuffer(), f.name);
    if (!r.number) throw new Error('לא זוהה מסמך הזמנה של משהב״ט');
    if (!r.items.length) throw new Error('לא נמצאו שורות שירות בהזמנה.');
    const idOf = r.items.find(i => i.consultantId && i.type === 'hours')?.consultantId;
    const who = S.db.people.find(p => idOf && digits(p.personalId).replace(/^0+/, '') === idOf.replace(/^0+/, '')) || S.db.people.find(p => r.approvedPerson && samePerson(p.name, r.approvedPerson));
    const ex = S.db.orders.find(o => digits(o.number) === r.number);
    const carry = (it, t) => {  // שומרים ק"מ ליום / שעות לחודש שהוגדרו ידנית בגרסה הקודמת
      const same = ex && linesOf(ex).find(l => String(l.itemNo) === String(it.itemNo)); const typeLast = ex && linesOf(ex, t).slice(-1)[0];
      return {dailyKm: t === 'km' ? (same?.dailyKm ?? typeLast?.dailyKm ?? who?.dailyKm ?? null) : null, monthlyHours: t === 'hours' ? (same?.monthlyHours ?? typeLast?.monthlyHours ?? null) : null};
    };
    const lines = r.items.map(it => ({itemNo: it.itemNo, type: it.type, label: it.type === 'km' ? 'הוצאות רכב' : 'שעות עבודה', rate: it.rate, qty: it.qty, budget: it.total,
      from: it.from, to: it.to, protocol: it.protocol, ...carry(it, it.type)}));
    const fields = {number: r.numberFormatted, version: r.version, validFrom: r.validFrom, validTo: r.validTo, protocol: r.protocol, sourcePdf: r.file, periods: r.periods, lines};
    const perTxt = r.periods.length > 1 ? ` · ${r.periods.length} תקופות: ` + r.periods.map(p => `${dateHe(p.from)}–${dateHe(p.to)}`).join(', ') : '';
    if (ex) {
      if (String(ex.version) === String(r.version)) { toast(`הזמנה ${r.numberFormatted} גרסה ${r.version} כבר קיימת`); return editOrder(ex.id); }
      const oldNos = linesOf(ex).map(l => String(l.itemNo || '')); const added = lines.filter(l => !oldNos.includes(String(l.itemNo)));
      const msg = `הזמנה ${r.numberFormatted} קיימת במערכת (גרסה ${ex.version || 0}, ${linesOf(ex).length} שורות).\n\nגרסה ${r.version}${r.replacesPrevious ? ' (מחליפה את הקודמת)' : ''}: ${lines.length} שורות, תוקף עד ${dateHe(r.validTo)}` +
        (added.length ? `\nשורות חדשות: ${added.map(l => `${l.itemNo} (${l.type === 'hours' ? 'שעות' : 'ק״מ'}, ${dateHe(l.from)}–${dateHe(l.to)}, ₪${num(l.budget, 0)})`).join(', ')}` : '') +
        `\n\nלעדכן את ההזמנה? הגרסה הקודמת תישמר בהיסטוריה.`;
      if (!confirm(msg)) return;

async function stepMerge(manualFile) {
  const r = S.prep;
  await run(async () => {
    const mf = await subDir(await personDir(personById(S.personId)), folderName(S.month));
    const rep = reportFor(S.personId, S.month);
    const checks = [];
    // --- PDF החשבון: בודקים לפי התוכן שזה באמת טופס 23.030 ולא דוח שעות
    let invBuf = null, invName = null;
    const tryInvoice = async (buf, name) => {
      const t = await pdfFirstPageText(buf); const k = pdfKind(t.text);
      if (k === 'report') return `הקובץ ${name} הוא דוח שעות (טופס 23.031) ולא החשבון. כנראה נשמר מהקובץ הלא נכון - פתח את ${r.names.xlsx} ושמור אותו כ-PDF.`;
      if (k !== 'invoice') return `בעמוד הראשון של ${name} לא נמצא "טופס 23.030".`;
      invBuf = buf; invName = name; checks.push({ok: true, text: `עמוד 1 של ${name} הוא טופס 23.030 (חשבון)`});
      const cur = r.plan.totalNoVat;
      if (t.text.replace(/\s/g, '').includes(fmtAmount(cur))) checks.push({ok: true, text: `הסכום בחשבון תואם: ₪${fmtAmount(cur)}`});
      else checks.push({ok: null, text: `לא נמצא בעמוד החשבון הסכום ₪${fmtAmount(cur)} - ודא שה-PDF נשמר מהקובץ ${r.names.xlsx} העדכני.`});
      return null;
    };
    let err = null;
    if (manualFile) err = await tryInvoice(await manualFile.arrayBuffer(), manualFile.name);
    else {
      if (await fileExists(mf, r.names.pdf)) err = await tryInvoice(await readFile(mf, r.names.pdf), r.names.pdf);
      if (!invBuf) {  // חיפוש לפי תוכן בכל קבצי ה-PDF בתיקייה
        const found = [];
        for (const e of await listEntries(mf)) {
          if (e.kind !== 'file' || !/\.pdf$/i.test(e.name) || /חשבון_ודיווח|מאוחד/.test(e.name) || e.name === r.names.pdf) continue;
          try { const b = await readFile(mf, e.name); const t = await pdfFirstPageText(b); if (pdfKind(t.text) === 'invoice' && t.text.replace(/\s/g, '').includes(fmtAmount(r.plan.totalNoVat))) found.push({name: e.name, buf: b}); } catch (x) {}
        }
        if (found.length === 1) { err = await tryInvoice(found[0].buf, found[0].name); }
        else if (found.length > 1) err = `נמצאו כמה קבצי PDF של חשבון מתאים (${found.map(x => x.name).join(', ')}) - בחר ידנית.`;
        else if (!err) err = `לא נמצא PDF של החשבון בתיקיית החודש. שמור את ${r.names.xlsx} כ-PDF (צעד 2), או בחר את הקובץ ידנית.`;
      }
    }
    if (!invBuf) throw new Error(err);
    // --- PDF דוח השעות
    const repPdfName = rep.reportPdf || (rep.reportXlsx || '').replace(/\.xlsx$/i, '.pdf');
    if (!repPdfName || !await fileExists(mf, repPdfName)) throw new Error(`לא נמצא PDF של דוח השעות (${repPdfName}). שמור את הדוח כ-PDF באותה תיקייה.`);
    const repBuf = await readFile(mf, repPdfName);
    const rk = pdfKind((await pdfFirstPageText(repBuf)).text);
    if (rk === 'invoice') throw new Error(`הקובץ ${repPdfName} מכיל חשבון ולא דוח שעות.`);
    checks.push(rk === 'report' ? {ok: true, text: `${repPdfName} הוא דוח שעות (טופס 23.031)`} : {ok: null, text: `לא זוהה "טופס 23.031" ב-${repPdfName} - בדוק שזה דוח השעות.`});
    const res = await mergeInvoiceAndReport(invBuf, repBuf);
    if (await fileExists(mf, r.names.merged) && !confirm(`${r.names.merged} כבר קיים. להחליף אותו?`)) return;
    await writeFile(mf, r.names.merged, res.bytes);

    r.exists.merged = r.exists.pdf = true; $('#prepOut').innerHTML = prepHtml(r);

}

  if (x.feeType === 'milestones' && milestones.length && Math.abs(sum - 100) > 0.01 && !confirm(`סכום אבני הדרך הוא ${qty(sum)}% ולא 100%. לשמור בכל זאת?`)) return;
  const pre = window.__engPrefill || {};
  const rec = {...(id ? engById(id) : {sourceFile: pre.sourceFile || null}), ...x, notes: notesEl ? notesEl.value.trim() : x.notes, vat: (Number(x.vat) || 0) / 100, terms: {type: $('#enTermsType').value, days: Number($('#enTermsDays').value) || 0}, milestones, extras};
  const r = upsert('engagements', rec, 'eng'); await saveDb(); closeModal(); S.projectId = r.projectId; S.engId = r.id; S.ptab = 'projects'; remember(); render(); toast('המתכנן נשמר');
}
async function deleteEng(id) { if (!confirm('למחוק את המתכנן וכל החשבונות שלו?')) return; removeRecs('bills', b => b.engagementId === id); removeRecs('engagements', e => e.id === id); S.engId = null; await saveDb(); closeModal(); render(); }
function importQuote(projectId) {
  pickFile('.pdf', f => run(async () => {
    const q = await parseQuotePdf(await f.arrayBuffer(), f.name);
    let pid = projectId;
    if (!pid) {
      const guess = q.projGuess && S.db.projects.find(p => q.projGuess.includes(p.name) || p.name.includes(q.projGuess));
      if (guess) pid = guess.id;
      else if (S.db.projects.length === 1 && confirm(`לשייך את ההצעה לפרויקט "${S.db.projects[0].name}"?`)) pid = S.db.projects[0].id;
      else { const name = prompt('שם הפרויקט (ייווצר פרויקט חדש):', q.projGuess || ''); if (!name) return; pid = upsert('projects', {name: name.trim()}, 'proj').id; await saveDb(); }
    }
    editEng(null, pid, {discipline: q.discipline, company: q.company, email: q.email, quoteNo: q.quoteNo, quoteDate: q.date, fee: q.fee, terms: q.terms || {type: 'eom', days: 30},
      milestones: q.milestones, extras: q.extras, sourceFile: q.file, feeType: 'milestones', notes: q.subject ? 'הנדון: ' + q.subject : ''}); modalDirty = true;
    toast(`נקראה הצעת המחיר: שכ״ט ${q.fee ? money(q.fee) : 'לא נמצא'}, ${q.milestones.length} אבני דרך (${qty(q.milestonesSum)}%), ${q.terms ? termsText(q.terms) : 'תנאי תשלום לא צוינו בהצעה - הוגדר שוטף + 30'} - בדוק והשלם`);
  }, 'קורא את הצעת המחיר…'));
}
/* ---- bill form */
function editBill(id, engId) {
  const b = id ? JSON.parse(JSON.stringify(S.db.bills.find(x => x.id === id))) : null;
  const e = engById(b ? b.engagementId : engId); if (!e) return;
  const bill = b || {engagementId: e.id, seq: (billsOf(e.id).reduce((a, x) => Math.max(a, Number(x.seq) || 0), 0) + 1), vat: e.vat ?? 0.18, lines: [], deal: {date: todayIso()}, transfer: {}, payment: {}, tax: {}};
  const fee = Number(e.fee) || 0;
  const portionOf = msId => (bill.lines.find(l => l.kind === 'ms' && l.msId === msId) || {}).portion ?? '';
  const msRows = (e.milestones || []).map(m => { const before = msClaimed(e, m.id, bill.id), amt = r2(fee * (m.percent || 0) / 100);
    return `<tr data-bm="${esc(m.id)}" data-amt="${amt}" data-before="${before}" data-pct="${m.percent || 0}"><td>${esc(m.name)}</td><td class="n">${qty(m.percent)}%</td><td class="n">${money(amt)}</td><td class="n">${qty(before)}%</td>
      <td><input class="num bmP" value="${esc(portionOf(m.id))}" style="width:70px" placeholder="%" oninput="billCalc('p', this)"></td><td><input class="num bmA" style="width:100px" placeholder="₪" oninput="billCalc('a', this)"></td><td class="small bmNote"></td></tr>`; }).join('');
  const hrs = bill.lines.find(l => l.kind === 'hours') || {}, extras = bill.lines.filter(l => l.kind === 'extra');
  const stage = (k, n, title, fields) => `<div class="stepBox ${billStatus(bill) >= n ? 'done' : ''}" style="margin-top:8px"><h3><span class="stepNo">${n}</span>${title}</h3><div class="form">${fields}</div></div>`;
  const dateF = (k, f, label, v) => `<label>${label}<div class="row" style="flex-wrap:nowrap"><input type="date" data-st="${k}.${f}" value="${esc(v || '')}"><button type="button" class="small ghost" onclick="this.previousElementSibling.value='${todayIso()}'">היום</button></div></label>`;
  const txtF = (k, f, label, v, ltr) => `<label>${label}<input data-st="${k}.${f}" value="${esc(v ?? '')}" class="${ltr ? 'num' : ''}"></label>`;
  modal(`${e.discipline || ''} · ${e.company || ''} · חשבון ${bill.seq}`, `
    <div class="form" id="bf">${fld('seq', 'מס׳ חשבון (סידורי אצל המתכנן)', bill.seq, {ltr: true})}${fld('vatP', 'מע״מ %', Math.round((bill.vat ?? 0.18) * 100), {num: true})}</div>
    ${e.feeType !== 'hourly' && (e.milestones || []).length ? `<h3>מה חויב בחשבון - לפי אבני הדרך (אפשר חלק משלב, למשל 50% מתוך שלב של 30%)</h3>
      <div class="tableWrap"><table><thead><tr><th>שלב</th><th>% משכ״ט</th><th>סכום השלב</th><th>חויב קודם</th><th>% מהשלב בחשבון זה</th><th>סכום</th><th></th></tr></thead><tbody>${msRows}</tbody></table></div>` : ''}
    ${e.feeType === 'hourly' || e.hourlyRate ? `<h3>שעות</h3><div class="form"><label>שעות<input id="bHours" class="num" value="${esc(hrs.hours ?? '')}" oninput="billCalc()"></label><label>תעריף<input id="bRate" class="num" value="${esc(hrs.rate ?? e.hourlyRate ?? '')}" oninput="billCalc()"></label></div>` : ''}
    <h3>תוספות / אחר</h3><div class="tableWrap"><table id="bxT"><tbody>${extras.map(bxRowHtml).join('')}</tbody></table></div>
    <button class="small" style="margin-top:6px" onclick="addBillExtraRow()">+ שורה</button>
    <div id="bTot" style="margin-top:10px"></div>
    <h3>מעקב שלבים</h3>
    ${stage('deal', 1, 'התקבלה חשבונית עסקה', txtF('deal', 'no', 'מספר חשבונית עסקה', bill.deal?.no, 1) + dateF('deal', 'date', 'תאריך קבלה', bill.deal?.date))}
    ${stage('transfer', 2, 'הועבר לתשלום', dateF('transfer', 'date', 'תאריך העברה', bill.transfer?.date) + txtF('transfer', 'to', 'הועבר אל (מזמין / גורם מאשר)', bill.transfer?.to) + txtF('transfer', 'approved', 'סכום שאושר (אם שונה)', bill.transfer?.approved, 1))}
    ${stage('payment', 3, 'שולם', dateF('payment', 'date', 'תאריך תשלום', bill.payment?.date) + txtF('payment', 'amount', 'סכום ששולם (כולל מע״מ)', bill.payment?.amount, 1) + txtF('payment', 'ref', 'אסמכתא', bill.payment?.ref))}
    ${stage('tax', 4, 'התקבלה חשבונית מס', txtF('tax', 'no', 'מספר חשבונית מס', bill.tax?.no, 1) + dateF('tax', 'date', 'תאריך', bill.tax?.date))}
    <label style="display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);margin-top:10px">הערות<input id="bNotes" value="${esc(bill.notes || '')}"></label>
    <div class="small muted" style="margin-top:6px">מועד תשלום לפי ההצעה (${esc(termsText(e.terms))}): <b id="bDue"></b></div>`,
    `<button class="primary" onclick="saveBill('${id || ''}','${e.id}')">שמור</button><button class="ghost" onclick="tryCloseModal()">ביטול</button>` + (id ? `<button class="danger" style="margin-inline-start:auto" onclick="deleteBill('${id}')">מחק חשבון</button>` : ''));
  document.querySelectorAll('tr[data-bm]').forEach(tr => { if (tr.querySelector('.bmP').value !== '') billCalc('p', tr.querySelector('.bmP')); });
  const dd = document.querySelector('[data-st="deal.date"]'); if (dd) dd.addEventListener('change', () => billCalc());
  window.__billEng = e.id; billCalc();
}
function bxRowHtml(x) { return `<tr data-bx><td><input data-f="desc" value="${esc(x.desc || '')}" placeholder="למשל: ביקור נוסף באתר" style="width:100%;min-width:220px"></td><td><input data-f="amount" class="num" value="${esc(x.amount ?? '')}" style="width:110px" oninput="billCalc()"></td><td><button class="small ghost" onclick="this.closest('tr').remove();billCalc()">✕</button></td></tr>`; }
function addBillExtraRow() { document.querySelector('#bxT tbody').insertAdjacentHTML('beforeend', bxRowHtml({})); }
function billCalc(mode, el) {
  if (el) { const tr = el.closest('tr'), amt = Number(tr.dataset.amt) || 0, before = Number(tr.dataset.before) || 0; const P = tr.querySelector('.bmP'), A = tr.querySelector('.bmA');
    if (mode === 'p') { const p = Number(P.value) || 0; A.value = P.value === '' ? '' : r2(amt * p / 100); } else { const a = Number(A.value.replace(/,/g, '')) || 0; P.value = A.value === '' ? '' : r2(amt ? a / amt * 100 : 0); }
    const p = Number(P.value) || 0, after = r2(before + p);
    tr.querySelector('.bmNote').innerHTML = P.value === '' ? '' : `<span style="color:${after > 100.5 ? 'var(--bad)' : 'var(--muted)'}">אחרי החשבון: ${qty(after)}% מהשלב = ${qty(r2(p * (Number(tr.dataset.pct) || 0) / 100))}% משכ״ט</span>`; }
  const lines = collectBillLines(); const net = r2(lines.reduce((a, l) => a + (Number(l.amount) || 0), 0)); const vat = (Number(document.querySelector('#bf [data-k=vatP]')?.value) || 0) / 100;
  const e = engById(window.__billEng); const el2 = $('#bTot'); if (el2) el2.innerHTML = `<div class="row"><span>סה״כ ללא מע״מ: <b>${money(net)}</b></span><span>מע״מ: ${money(r2(net * vat))}</span><span>סה״כ לתשלום: <b>${money(r2(net * (1 + vat)))}</b></span></div>`;
  const d = document.querySelector('[data-st="deal.date"]')?.value; const due = $('#bDue'); if (due) due.textContent = d && e ? dateHe(dueDate({deal: {date: d}}, e)) : '—';
}
function collectBillLines() {
  const lines = [];
  document.querySelectorAll('tr[data-bm]').forEach(tr => { const p = tr.querySelector('.bmP').value, a = tr.querySelector('.bmA').value; if (p !== '' && Number(p)) lines.push({kind: 'ms', msId: tr.dataset.bm, portion: Number(p), amount: Number(String(a).replace(/,/g, '')) || 0}); });
  const h = $('#bHours'), rt = $('#bRate'); if (h && h.value) lines.push({kind: 'hours', hours: Number(h.value), rate: Number(rt.value) || 0, amount: r2(Number(h.value) * (Number(rt.value) || 0))});
  document.querySelectorAll('#bxT tr[data-bx]').forEach(tr => { const d = tr.querySelector('[data-f=desc]').value.trim(), a = tr.querySelector('[data-f=amount]').value; if (d || a) lines.push({kind: 'extra', desc: d, amount: Number(String(a).replace(/,/g, '')) || 0}); });
  return lines;
}
async function saveBill(id, engId) {
  const lines = collectBillLines(); if (!lines.length) return toast('לא הוזן מה חויב בחשבון', true);
  const x = formVals($('#bf')); const st = {deal: {}, transfer: {}, payment: {}, tax: {}};
  document.querySelectorAll('[data-st]').forEach(el => { const [k, f] = el.dataset.st.split('.'); const v = el.value.trim(); st[k][f] = v === '' ? null : (['amount', 'approved'].includes(f) ? Number(v.replace(/,/g, '')) : v); });
  if (st.payment.date && !st.transfer.date) st.transfer.date = st.payment.date;   // שולם => הועבר
  const e = engById(engId);
  for (const l of lines.filter(l => l.kind === 'ms')) { const m = (e.milestones || []).find(z => z.id === l.msId); const after = msClaimed(e, l.msId, id || null) + l.portion; if (after > 100.5 && !confirm(`השלב "${m?.name}" יחויב ב-${qty(after)}% (מעל 100%). לשמור בכל זאת?`)) return; }
  const old = id ? S.db.bills.find(b => b.id === id) : {};
  upsert('bills', {...old, engagementId: engId, seq: x.seq, vat: (Number(x.vatP) || 0) / 100, lines, ...st, notes: $('#bNotes').value.trim()}, 'bill');
  await saveDb(); closeModal(); render(); toast(`החשבון נשמר · ${STAGE_NAMES[billStatus({...st})]}`);
}
async function deleteBill(id) { if (!confirm('למחוק את החשבון?')) return; removeRecs('bills', b => b.id === id); await saveDb(); closeModal(); render(); }

/* ===================================================================== boot */
(async function boot() {
  try { await idb.open(); } catch (e) { S.idbOk = false; }
  try { const d = await idb.get('db'); if (d) S.db = dbFrom(d); } catch (e) {}
  try { const h = await idb.get('root'); if (h) { S.root = h; S.rootPerm = await checkPerm(h, false); if (S.rootPerm === 'granted') await maybeLoadDataFile(); } } catch (e) {}
  if (!window.XLSX || !window.JSZip || !window.PDFLib) toast('חלק מהרכיבים לא נטענו - בדוק חיבור לאינטרנט ורענן את הדף.', true);
  if (S.personId && !personById(S.personId)) S.personId = null;
  render();
  if (fbUrl()) { await cloudSync(); setInterval(cloudPoll, 20000); window.addEventListener('focus', cloudPoll); }
  else setInterval(() => { if (fbUrl()) cloudPoll(); }, 20000);
})();
document.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); tryCloseModal(true); } });
window.__atlas = {parseQuotePdf, projAlerts, dueDate, engStats, S, parse23031, readInvoice, writeInvoice, planNextInvoice, parseOrderPdf, mergeInvoiceAndReport, idb, render, checkPerm, maybeLoadDataFile};
</script>
